name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The audio.cpp release and the GGUF models are gigabytes and are not in the
      # repository; the engine-backed checks SKIP themselves instead of failing.
      - name: Syntax + unit tests + tool contract
        run: npm test

      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'

      - name: Python helper self-check
        if: runner.os == 'Linux'
        run: python scripts/check_scripts.py
